name: Build Android APK

# Bangun gocatering-mobile menjadi APK di server GitHub, bukan di PC lokal.
# Hasilnya diunggah sebagai artifact DAN (pada tag v*) sebagai GitHub Release
# yang menempelkan berkas LICENSE — kode maupun aplikasinya tidak boleh
# diunduh/dipakai tanpa izin tertulis (lihat LICENSE).

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Terbitkan juga sebagai GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      # Tag diag-* dipakai ulang-alik perbaikan build: workflow jalan tapi
      # tidak menerbitkan Release (lihat syarat langkah paling bawah).
      - 'diag-*'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: gocatering-mobile
  ORG: id.gocatering
  PROJECT: gocatering_mobile

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Repo ini berlisensi terbatas. Build berhenti kalau LICENSE hilang atau
      # isinya diubah, supaya APK tidak pernah tersebar tanpa klausulnya.
      - name: Gerbang lisensi
        run: |
          set -e
          for f in LICENSE "$APP_DIR/LICENSE"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f tidak ada — build dihentikan"
              exit 1
            fi
          done
          if ! grep -qi "written permission" "$APP_DIR/LICENSE"; then
            echo "::error::LICENSE aplikasi kehilangan klausul izin tertulis"
            exit 1
          fi
          echo "LICENSE OK pada berkas root dan $APP_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versi perkakas
        run: |
          flutter --version
          java -version 2>&1 | head -3

      # Repo hanya menyimpan sumbernya (lib/, test/, pubspec.yaml). Kerangka
      # android/ dibangkitkan di CI sehingga tidak ada berkas build yang ikut
      # ke dalam git. Dibuat di folder terpisah lalu disalin, supaya lib/ dan
      # README tidak tertimpa oleh templat.
      - name: Bangkitkan kerangka android
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          scaffold="$(mktemp -d)/scaffold"
          flutter create --org "$ORG" --project-name "$PROJECT" \
            --platforms=android --template app "$scaffold"
          cp -r "$scaffold/android" "$APP_DIR/android"
          [ -f "$APP_DIR/.metadata" ] || cp "$scaffold/.metadata" "$APP_DIR/.metadata"
          test -f "$APP_DIR/android/build.gradle.kts" -o -f "$APP_DIR/android/build.gradle"
          echo "kerangka android/ siap"

      # Hanya berarti kalau keystore rilis tersedia. Tanpa secret, langkah ini
      # dilewati supaya templat android/ yang dibangkitkan Flutter dipakai apa
      # adanya (AGP 9 menolak blok tambahan yang salah — lihat skripnya).
      - name: Sambungkan signing rilis
        if: env.KEYSTORE_B64 != ''
        working-directory: ${{ env.APP_DIR }}
        env:
          RELEASE_SIGNING: '1'
        run: bash scripts/enable-release-signing.sh

      # included build milik Flutter hanya mencari plugin di gradlePluginPortal;
      # satu kali portal itu tidak memancarkan artefak Kotlin sudah cukup untuk
      # membatalkan build. Init script ini menambah Maven Central + Google.
      - name: Pasang init script Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          cp "$APP_DIR/scripts/ci-gradle-init.gradle" "$HOME/.gradle/init.gradle"
          echo "~/.gradle/init.gradle terpasang"

      - name: Dependensi
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # `dart analyze` membatalkan build kalau ada temuan. Berkas log job hanya
      # bisa dibuka anggota repo, jadi saat gagal 30 baris pertama keluarannya
      # dikirim sebagai anotasi — anotasi ikut ter-render di halaman run publik.
      - name: Analisis statis
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          dart analyze > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ "$code" -ne 0 ]; then
            awk 'NR<=30 {printf("::notice::[%d] %s\n", NR, $0)}' analyze.txt
            echo "::notice::exit=$code total_baris=$(wc -l < analyze.txt) byte=$(wc -c < analyze.txt)"
          fi
          exit $code

      - name: Unit test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test

      # Log job dan artifact hanya bisa diunduh anggota repo, dan anotasi
      # ternyata tidak selalu terbit. Jadi kalau build gagal, penyebabnya
      # (keluaran Flutter + Gradle --stacktrace + berkas gradle yang dipakai)
      # dikumpulkan ke build-diag.log lalu di-push ke cabang `ci-diag`, yang
      # terbaca siapa pun lewat:
      #   https://raw.githubusercontent.com/gatnadf-AI/gocatering/ci-diag/build-diag.log
      # Cabang itu khusus diagnosis; `main` tidak pernah disentuh.
      - name: Build APK debug (langsung bisa dipasang di HP)
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Unduh dependensi Gradle sesekali gagal dari sisi server; satu
          # kegagalan jaringan tidak boleh menggagalkan seluruh rilis.
          code=1
          for try in 1 2 3; do
            if flutter build apk --debug > build-debug.log 2>&1; then code=0; break; fi
            code=$?
            echo "percobaan $try gagal (exit=$code)"
            [ "$try" -lt 3 ] && sleep 20
          done
          if [ "$code" -ne 0 ]; then
            echo "build gagal — mengulang lewat Gradle untuk sebab lengkap"
            ( cd android && ./gradlew :app:assembleDebug --stacktrace --console=plain ) > gradle-debug.log 2>&1
            gcode=$?
            {
              echo "### flutter build apk --debug — exit=$code"
              tail -n 90 build-debug.log
              echo
              echo "### ./gradlew :app:assembleDebug --stacktrace — exit=$gcode"
              grep -n -A 20 'What went wrong' gradle-debug.log | head -n 70
              tail -n 90 gradle-debug.log
              echo
              echo "### lingkungan"
              flutter --version 2>&1 | head -n 3
              java -version 2>&1 | head -n 2
              grep -h distributionUrl android/gradle/wrapper/gradle-wrapper.properties 2>&1
              echo
              echo "### android/settings.gradle*"
              cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle 2>/dev/null
              echo
              echo "### android/app/build.gradle* (45 baris terakhir)"
              tail -n 45 android/app/build.gradle.kts 2>/dev/null || tail -n 45 android/app/build.gradle 2>/dev/null
            } > "$GITHUB_WORKSPACE/build-diag.log"
            tail -n 40 "$GITHUB_WORKSPACE/build-diag.log"
            git -C "$GITHUB_WORKSPACE" checkout -q -B ci-diag
            git -C "$GITHUB_WORKSPACE" add -f build-diag.log
            git -C "$GITHUB_WORKSPACE" -c user.name=ci-diag -c user.email=ci@gocatering.local \
              commit -q -m "diag(build): keluaran build apk debug"
            git -C "$GITHUB_WORKSPACE" -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" \
              push -f "https://github.com/$GITHUB_REPOSITORY" ci-diag \
              && echo "diagnostik tersimpan di cabang ci-diag"
            echo "::notice::build apk debug gagal - lihat cabang ci-diag/build-diag.log"
          else
            tail -n 12 build-debug.log
          fi
          exit $code

      - name: Build APK + AAB rilis (butuh secret keystore)
        if: env.KEYSTORE_B64 != ''
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=release.jks
          EOF
          flutter build apk --release
          flutter build appbundle --release

      - name: Kumpulkan hasil + checksum
        run: bash "$APP_DIR/scripts/collect-artifacts.sh" "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: gocatering-apk-debug
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: gocatering-release
          path: |
            dist/*-release.apk
            dist/*.aab
          if-no-files-found: error

      # Release = cara termudah mengirim APK ke Anda tanpa mengirim source.
      # Berkas LICENSE ikut ditempel supaya ketentuannya sampai bersamaan
      # dengan aplikasinya.
      - name: Terbitkan GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$APP_DIR/scripts/publish-release.sh"

      # Salinan ke GitLab (gitlab.com/clr657/gocatering) supaya berkas yang sama
      # tersedia juga di sana tanpa memindahkan mesin build. GITLAB_TOKEN
      # (scope api) dibaca dari env tingkat job; kalau secret belum dipasang,
      # kondisi ini salah dan langkahnya tidak jalan sama sekali.
      - name: Salin rilis ke GitLab
        if: env.GITLAB_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release)
        run: bash "$APP_DIR/scripts/publish-gitlab.sh"
